name: Faithfulness eval

# Runs the golden set against the real model. Needs the OPENAI_API_KEY repo secret.
on:
  workflow_dispatch:
    inputs:
      min_pass:
        description: "Minimum pass rate (0-1)"
        default: "0.9"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.eval.run_eval --min-pass ${{ inputs.min_pass }}
      - name: Report
        if: always()
        run: cat eval_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval_report.*
